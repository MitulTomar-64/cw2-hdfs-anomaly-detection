name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run data quality tests
      run: python -m pytest tests/test_data_quality.py -v
    
    - name: Run preprocessing tests
      run: python -m pytest tests/test_preprocessing.py -v
    
    - name: Run model training tests
      run: python -m pytest tests/test_model_training.py -v
    
    - name: Run model evaluation tests
      run: python -m pytest tests/test_model_evaluation.py -v
    
    - name: Run integration tests
      run: python -m pytest tests/test_integration.py -v
    
    - name: Run performance tests
      run: python -m pytest tests/test_performance.py -v

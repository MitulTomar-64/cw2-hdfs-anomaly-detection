name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install azure-storage-blob
    
    - name: Download CSV from Azure
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      run: |
        python -c "
        from azure.storage.blob import BlobClient
        import os
        
        # Get connection string from GitHub Secrets
        conn_str = os.environ['AZURE_STORAGE_CONNECTION_STRING']
        
        # Download file from Azure Blob Storage
        blob = BlobClient.from_connection_string(conn_str, container_name='data', blob_name='final_structured_hdfs_logs-5.csv')
        
        # Save to current directory
        with open('final_structured_hdfs_logs-5.csv', 'wb') as file:
            file.write(blob.download_blob().readall())
        
        print('✓ CSV downloaded from Azure Blob Storage!')
        "
    
    - name: Run data quality tests
      run: python -m pytest tests/test_data_quality.py -v
    
    - name: Run preprocessing tests
      run: python -m pytest tests/test_preprocessing.py -v
    
    - name: Run model training tests
      run: python -m pytest tests/test_model_training.py -v
    
    - name: Run model evaluation tests
      run: python -m pytest tests/test_model_evaluation.py -v
    
    - name: Run integration tests
      run: python -m pytest tests/test_integration.py -v
    
    - name: Run performance tests
      run: python -m pytest tests/test_performance.py -v
